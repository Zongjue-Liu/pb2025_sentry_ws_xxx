pb2025_sentry_behavior_server:
  ros__parameters:
    use_sim_time: true
    action_name: pb2025_sentry_behavior         # Optional
    tick_frequency: 5                          # Optional (defaults to 100 Hz)
    groot2_port: 1667                           # Optional (defaults to 1667)
    ros_plugins_timeout: 1000                   # Optional (defaults 1000 ms)
    use_cout_logger: false                      # Optional (defaults to false)
    global_costmap_topic: /red_standard_robot1/global_costmap/costmap
    detector_topic: /red_standard_robot1/detector/armors
    tracker_topic: /red_standard_robot1/tracker/target

    plugins:
      - pb2025_sentry_behavior/bt_plugins

    behavior_trees:
      - pb2025_sentry_behavior/behavior_trees

    CalculateAttackPose:
      attack_radius: 2.0                        # 攻击半径（米）
      num_sectors: 36                           # 扇区划分数量
      cost_threshold: 50                        # 栅格的占用概率，大于该值将被视为障碍物 [0, 100]
      clearance_radius: 0.3                     # 候选点周围必须保持无障碍的半径（米）
      robot_base_frame: chassis
      visualize: true

goal_pose_nav_bridge:
  ros__parameters:
    use_sim_time: true
    goal_topic: /goal_pose
    game_status_topic: /referee/game_status
    navigate_to_pose_action: /red_standard_robot1/navigate_to_pose
    reached_goal_topic: /navigation/reached_goal
    position_tolerance: 0.4
    orientation_tolerance: 0.01
    retry_period: 0.2
    minimum_goal_update_period: 1.0

pb2025_sentry_behavior_client:
  ros__parameters:
    use_sim_time: true
    target_tree: rmul2026_ul_aggressive
